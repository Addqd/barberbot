[project]
name = "barberbot"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.4",
]

[tool.poe.tasks]

# Existing application commands — preserved exactly.
dev = "python -m barberbot"
test = "pytest"
test-cov = "pytest --cov=barberbot --cov-report=term-missing"
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "ruff format ."
format-check = "ruff format . --check"
typecheck = "mypy barberbot"
check = ["lint", "format-check", "typecheck", "test"]

# Main database — existing commands retained and supplemented.
db-upgrade = { cmd = "alembic upgrade head", env = { BARBERBOT_DB_TARGET = "main" } }
db-downgrade = { cmd = "alembic downgrade -1", env = { BARBERBOT_DB_TARGET = "main" } }
db-current = { cmd = "alembic current", env = { BARBERBOT_DB_TARGET = "main" } }
db-history = "alembic history"
db-heads = "alembic heads"
db-revision = "alembic revision"
db-seed = { cmd = "python -m scripts.seed", env = { BARBERBOT_DB_TARGET = "main" } }

# Separate test database. Uses the SAME revision files, not copied migrations.
db-test-create = "python -m scripts.create_test_db"
db-test-upgrade = { cmd = "alembic upgrade head", env = { BARBERBOT_DB_TARGET = "test" } }
db-test-downgrade = { cmd = "alembic downgrade -1", env = { BARBERBOT_DB_TARGET = "test" } }
db-test-current = { cmd = "alembic current", env = { BARBERBOT_DB_TARGET = "test" } }
db-test-seed = { cmd = "python -m scripts.seed", env = { BARBERBOT_DB_TARGET = "test" } }
db-test-smoke = { cmd = "python -m scripts.check_test_db", env = { BARBERBOT_DB_TARGET = "test" } }
# DANGEROUS: removes all test tables/data; main DB cannot be targeted here.
db-test-empty = { cmd = "alembic downgrade base", env = { BARBERBOT_DB_TARGET = "test" } }

# Existing Docker commands — preserved exactly.
db-up = "docker compose up -d db"
db-down = "docker compose down"
db-status = "docker compose ps"
db-logs = "docker compose logs -f db"
