[project]
name = "barberbot"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.4",
]

[tool.poe.tasks]

# Запуск приложения
dev = "python -m barberbot"

# Тестирование
test = "pytest"
test-cov = "pytest --cov=barberbot --cov-report=term-missing"

# Линтинг и форматирование
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "ruff format ."
format-check = "ruff format . --check"

# Статическая типизация
typecheck = "mypy barberbot"

# Миграции базы данных
db-upgrade = "alembic upgrade head"
db-downgrade = "alembic downgrade -1"
db-history = "alembic history"

# Комплексные проверки
check = ["lint", "format-check", "typecheck", "test"]

# Docker / PostgreSQL
db-up = "docker compose up -d db"
db-down = "docker compose down"
db-status = "docker compose ps"
db-logs = "docker compose logs -f db"